<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - KAPTAN-HETM</title>
    {% load static %}
    <style>
        body { background-color: #0b0f19; color: #ffffff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: #111827; padding: 40px; border-radius: 12px; border: 1px solid #1f2937; width: 380px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .form-control { width: 100%; padding: 12px; margin: 15px 0; background: #1f2937; border: 1px solid #374151; color: white; border-radius: 8px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn:hover { background: #1d4ed8; }
        .links a { color: #9ca3af; text-decoration: none; font-size: 13px; display: block; margin-top: 15px; }
        .links a:hover { color: white; }
        .alert-error { background: rgba(220, 38, 38, 0.2); border: 1px solid #dc2626; color: #f87171; padding: 10px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="margin: 0 0 10px 0;">Forgot Password</h2>
        <p style="color: #9ca3af; font-size: 13px; margin-bottom: 25px;">Enter your registered mobile number to receive OTP and recover your username & password.</p>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert-error">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="mobile" class="form-control" placeholder="Enter Registered Mobile Number" required>
            <button type="submit" class="btn">Send OTP ➔</button>
        </form>
        
        <div class="links">
            <a href="{% url 'login' %}">Back to Login</a>
        </div>
    </div>
</body>
</html>
