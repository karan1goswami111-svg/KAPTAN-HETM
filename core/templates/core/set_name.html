<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set Display Name - KAPTAN-HETM</title>
    <style>
        body { background-color: #0b0f19; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #111827; padding: 40px; border-radius: 12px; border: 1px solid #1f2937; width: 100%; max-width: 400px; text-align: center; }
        .form-control { width: 100%; padding: 12px; margin: 15px 0; background: #1f2937; border: 1px solid #374151; color: white; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        .btn { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Set Your Display Name</h2>
        <p style="color: #9ca3af; font-size: 13px;">This name will be used across your groups and personal expense tracking (e.g., Karan).</p>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="display_name" class="form-control" placeholder="Enter your real name (e.g., Karan)" required>
            <button type="submit" class="btn">Continue to Dashboard ➔</button>
        </form>
    </div>
</body>
</html>
